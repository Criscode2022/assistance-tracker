name: Tests

on:
  push:
  pull_request:

jobs:
  unit-and-integration-tests:
    name: Angular unit & integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run unit tests
        run: npm run test:ci
        env:
          CHROME_BIN: chrome
          CI: true

      - name: Run integration tests
        run: npm run test:integration
        env:
          CHROME_BIN: chrome
          CI: true

  e2e-tests:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Playwright browser
        run: npm run e2e:install

      - name: Run E2E tests
        run: npm run e2e:ci
        env:
          CI: true
