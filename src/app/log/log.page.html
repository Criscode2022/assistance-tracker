<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registro de Asistencia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list-header>
    <ion-label>{{ monthLabel }}</ion-label>
  </ion-list-header>

  <ion-list>
    <ion-item
      *ngFor="let day of days"
      [class.today-item]="day.isToday"
      [disabled]="day.isFuture"
      button
      (click)="openStatusPicker(day)"
      detail="false">

      <!-- Status icon -->
      <ion-icon
        slot="start"
        [name]="statusIcon(day.status)"
        [color]="statusColor(day.status)"
        class="status-icon">
      </ion-icon>

      <!-- Day info -->
      <ion-label>
        <h2>
          {{ day.dateLabel }}
          <ion-badge *ngIf="day.isToday" color="primary" class="today-badge">Hoy</ion-badge>
        </h2>
        <p>{{ day.dayLabel | titlecase }}</p>
      </ion-label>

      <!-- Status label -->
      <ion-note slot="end" [color]="statusColor(day.status)">
        {{ statusLabel(day.status) }}
      </ion-note>

    </ion-item>
  </ion-list>

  <div class="legend">
    <ion-chip color="success" outline>
      <ion-icon name="checkmark-circle"></ion-icon>
      <ion-label>Presente</ion-label>
    </ion-chip>
    <ion-chip color="warning" outline>
      <ion-icon name="time"></ion-icon>
      <ion-label>Impuntual</ion-label>
    </ion-chip>
    <ion-chip color="danger" outline>
      <ion-icon name="close-circle"></ion-icon>
      <ion-label>Falta</ion-label>
    </ion-chip>
  </div>
</ion-content>
