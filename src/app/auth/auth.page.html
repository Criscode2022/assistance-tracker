<ion-header class="modern-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'AUTH.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="auth-content">
  <div class="auth-hero">
    <ion-icon name="cloud-upload-outline"></ion-icon>
    <h1>{{ 'AUTH.HERO_TITLE' | translate }}</h1>
    <p>{{ 'AUTH.HERO_DESC' | translate }}</p>
  </div>

  <ion-card class="offline-banner" *ngIf="hasOfflineData && tab === 'signup'">
    <ion-card-content>
      <div class="banner-row">
        <ion-icon name="information-circle-outline" color="primary"></ion-icon>
        <span>{{ 'AUTH.SIGNUP_BANNER' | translate }}</span>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-card class="offline-banner muted" *ngIf="hasOfflineData && tab === 'signin'">
    <ion-card-content>
      <div class="banner-row">
        <ion-icon name="swap-horizontal-outline" color="medium"></ion-icon>
        <span>{{ 'AUTH.SIGNIN_BANNER' | translate }}</span>
      </div>
    </ion-card-content>
  </ion-card>

  <div class="tab-row">
    <button type="button" class="tab-btn" [class.active]="tab === 'signup'" (click)="setTab('signup')">
      {{ 'AUTH.TAB_SIGNUP' | translate }}
    </button>
    <button type="button" class="tab-btn" [class.active]="tab === 'signin'" (click)="setTab('signin')">
      {{ 'AUTH.TAB_SIGNIN' | translate }}
    </button>
  </div>

  <form class="auth-form" (ngSubmit)="submit()">
    <ion-list lines="none" class="form-list">
      <ion-item *ngIf="tab === 'signup'">
        <ion-input
          [label]="'AUTH.NAME' | translate"
          labelPlacement="stacked"
          type="text"
          [(ngModel)]="name"
          name="name"
          [placeholder]="'AUTH.NAME_PLACEHOLDER' | translate"
          autocomplete="name">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          [label]="'AUTH.EMAIL' | translate"
          labelPlacement="stacked"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@email.com"
          required
          autocomplete="email">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          [label]="'AUTH.PASSWORD' | translate"
          labelPlacement="stacked"
          type="password"
          [(ngModel)]="password"
          name="password"
          [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | translate"
          required
          minlength="8"
          autocomplete="{{ tab === 'signup' ? 'new-password' : 'current-password' }}">
        </ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" type="submit" class="submit-btn" [disabled]="loading">
      <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      <span *ngIf="!loading">{{ (tab === 'signup' ? 'AUTH.SUBMIT_SIGNUP' : 'AUTH.SUBMIT_SIGNIN') | translate }}</span>
    </ion-button>
  </form>

  <p class="auth-hint">
    {{ 'AUTH.HINT' | translate }}
  </p>
</ion-content>
